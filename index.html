<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="SaBo — Buy and sell products online."
  >

  <title>SaBo — Sell & Buy Online</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <nav class="nav container" aria-label="Main navigation">

      <a href="index.html" class="logo" aria-label="SaBo home">
        SaBo
      </a>

      <button
        id="sellButton"
        class="button button-primary"
        type="button"
      >
        Sell
      </button>

    </nav>
  </header>

  <main>

    <section class="hero">

      <div class="container hero-content">

        <span class="eyebrow">Sell & Buy Online</span>

        <h1>Find what you need.<br>Sell what you have.</h1>

        <p>
          Discover products from people and businesses around you.
        </p>

        <div class="search-wrapper">

          <label for="searchInput" class="sr-only">
            Search products
          </label>

          <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="Search products..."
            autocomplete="off"
          >

        </div>

      </div>

    </section>

    <section class="container marketplace">

      <div class="section-heading">

        <div>
          <span class="section-label">Browse</span>
          <h2>Categories</h2>
        </div>

        <button
          id="allProductsButton"
          class="text-button"
          type="button"
        >
          View all
        </button>

      </div>

      <div
        id="categories"
        class="categories"
        aria-label="Product categories"
      >
        <div class="loading">Loading categories...</div>
      </div>

      <div class="section-heading products-heading">

        <div>
          <span class="section-label">Marketplace</span>

          <h2 id="productsTitle">
            Featured Products
          </h2>
        </div>

        <span
          id="productCount"
          class="product-count"
        >
          0 products
        </span>

      </div>

      <div
        id="products"
        class="products"
        aria-live="polite"
      >
        <div class="loading">Loading products...</div>
      </div>

    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <strong>SaBo</strong>
      <p>Sell & Buy Online</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

</body>
</html>
